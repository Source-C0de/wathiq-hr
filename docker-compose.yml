services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: hrai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hrai-ingest
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      - ./data:/app/data
    command: ["python", "ingest/run_pipeline.py", "--reset"]
    profiles: ["ingest"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hrai-api
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8000:8000"
    volumes:
      - ./monitoring:/app/monitoring
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles: ["api"]

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hrai-app
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8501:8501"
    volumes:
      - ./monitoring:/app/monitoring
    command: ["streamlit", "run", "app/Home.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  qdrant_data: