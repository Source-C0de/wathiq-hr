services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: hrai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # Qdrant image (Ubuntu-based) has no curl/wget/python; use bash /dev/tcp.
      # This succeeds only when the port is actually accepting connections.
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hrai-ingest
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      # ingest needs the raw docs; mount the local data dir read-only.
      - ./data:/app/data:ro
    # First-time run is destructive; reruns without --reset are incremental.
    command: ["python", "ingest/run_pipeline.py", "--reset"]
    profiles: ["ingest"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hrai-api
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8000:8000"
    # Persist SQLite logs on the host so dashboards survive container restarts.
    volumes:
      - ./monitoring:/app/monitoring
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles: ["api"]

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hrai-app
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8501:8501"
    volumes:
      - ./monitoring:/app/monitoring
    command: ["streamlit", "run", "app/Home.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  qdrant_data:
